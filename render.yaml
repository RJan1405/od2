services:
  - type: web
    name: odnix-backend
    env: python
    buildCommand: "bash build.sh"
    startCommand: "daphne odnix.asgi:application --port $PORT --bind 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENCRYPTION_KEY
        generateValue: true
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: ENABLE_PHONE_VERIFICATION
        value: "True"
      - key: DEBUG
        value: "False"
      - key: ENABLE_ANALYTICS
        value: "True"
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        value: "https://us.i.posthog.com"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: odnix-redis
          property: connectionString

  - type: worker
    name: odnix-celery-worker
    env: python
    buildCommand: "bash build.sh"
    startCommand: "celery -A odnix worker --loglevel=info --concurrency=2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_ANALYTICS
        value: "True"
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        value: "https://us.i.posthog.com"
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: odnix-redis
          property: connectionString

  - type: redis
    name: odnix-redis
    plan: free
    ipAllowList: []

